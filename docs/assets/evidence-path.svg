<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title description">
  <title id="title">api-intel evidence path example</title>
  <desc id="description">A project-authored illustration showing a supported endpoint path to a database write and a dashed external-message path ending at an explicit proof boundary.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#8aa4c8" />
    </marker>
    <style>
      .panel { fill: #0b1728; stroke: #2e496d; stroke-width: 2; }
      .node { fill: #152a45; stroke: #79a7e8; stroke-width: 2; }
      .terminal { fill: #0f5132; stroke: #63d69b; stroke-width: 2; }
      .boundary { fill: #3c2d08; stroke: #f5c451; stroke-width: 2; }
      .line { fill: none; stroke: #8aa4c8; stroke-width: 3; marker-end: url(#arrow); }
      .dash { stroke-dasharray: 10 8; }
      .title { fill: #f5f8ff; font: 700 28px system-ui, sans-serif; }
      .label { fill: #f5f8ff; font: 600 18px system-ui, sans-serif; text-anchor: middle; }
      .small { fill: #b9c9de; font: 15px system-ui, sans-serif; text-anchor: middle; }
      .edge { fill: #b9c9de; font: 14px system-ui, sans-serif; text-anchor: middle; }
      .notice { fill: #ffe08a; font: 600 16px system-ui, sans-serif; text-anchor: middle; }
    </style>
  </defs>
  <rect class="panel" x="1" y="1" width="1198" height="518" rx="18" />
  <text class="title" x="48" y="55">Evidence path — synthetic Notes fixture</text>

  <rect class="node" x="48" y="125" width="190" height="90" rx="14" />
  <text class="label" x="143" y="162">POST /notes</text>
  <text class="small" x="143" y="190">endpoint</text>

  <rect class="node" x="310" y="125" width="220" height="90" rx="14" />
  <text class="label" x="420" y="162">NotesController</text>
  <text class="small" x="420" y="190">.create()</text>

  <rect class="node" x="602" y="125" width="220" height="90" rx="14" />
  <text class="label" x="712" y="162">NotesService</text>
  <text class="small" x="712" y="190">.create()</text>

  <rect class="terminal" x="894" y="125" width="255" height="90" rx="14" />
  <text class="label" x="1022" y="162">WRITE note</text>
  <text class="small" x="1022" y="190">TypeORM repository.save</text>

  <path class="line" d="M 238 170 L 310 170" />
  <path class="line" d="M 530 170 L 602 170" />
  <path class="line" d="M 822 170 L 894 170" />
  <text class="edge" x="274" y="150">routes to</text>
  <text class="edge" x="566" y="150">calls</text>
  <text class="edge" x="858" y="150">writes</text>

  <rect class="node" x="602" y="330" width="220" height="90" rx="14" />
  <text class="label" x="712" y="367">message producer</text>
  <text class="small" x="712" y="395">static target evidence</text>

  <rect class="boundary" x="894" y="330" width="255" height="90" rx="14" />
  <text class="label" x="1022" y="367">proof stops here</text>
  <text class="small" x="1022" y="395">external or unobserved consumer</text>

  <path class="line" d="M 712 215 L 712 330" />
  <path class="line dash" d="M 822 375 L 894 375" />
  <text class="edge" x="751" y="279">initiates</text>
  <text class="notice" x="858" y="351">conditional</text>

  <text class="small" x="600" y="480">Every supported edge retains source evidence; dashed edges do not claim runtime delivery.</text>
</svg>

name: API Intelligence

on:
  pull_request:

permissions:
  contents: read

jobs:
  api-intel:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out trusted baseline
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.base.sha }}
          path: .api-intel-ci-workspaces/baseline
          persist-credentials: false

      - name: Check out untrusted candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.sha }}
          path: .api-intel-ci-workspaces/candidate
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.14.0
          package-manager-cache: false

      - name: Set up pinned pnpm
        run: npm install --global pnpm@11.19.0 --ignore-scripts

      # Replace OWNER/REPOSITORY and ACTION_COMMIT_SHA. Keep a full commit SHA here;
      # never run the candidate checkout's local copy of this action.
      - name: Evaluate API intelligence
        uses: OWNER/REPOSITORY@ACTION_COMMIT_SHA
        with:
          baseline-revision: ${{ github.event.pull_request.base.sha }}
          candidate-revision: ${{ github.event.pull_request.head.sha }}
          configuration: .api-intel-ci-workspaces/baseline/api-intel.config.json
          artifact-name: api-intel-${{ github.event.pull_request.number }}-${{ github.run_attempt }}

name: Published Release Verification

on:
  pull_request:
    paths:
      - .github/workflows/published-release-verification.yml
      - packaging/release/published-alpha-contract.json
      - scripts/prepare-published-action-targets.mjs
      - scripts/verify-package-install.mjs
      - scripts/verify-published-action-result.mjs
      - scripts/verify-published-release.mjs
      - test/fixtures/github-action/controlled/**
      - test/unit/documentation/phase-o5-published-release.test.ts
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: published-release-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  package-matrix:
    name: npm package / ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        os:
          - ubuntu-24.04
          - windows-2025
        node:
          - 22.13.1
          - 24.20.0
    steps:
      - name: Check out the verifier without persistent credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up pinned Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false

      - name: Install the verifier toolchain without lifecycle scripts
        run: |
          npm install --global pnpm@11.19.0 --ignore-scripts --no-audit --no-fund
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Verify the exact public package in isolated npm and pnpm consumers
        run: >-
          node scripts/verify-published-release.mjs
          --result-file
          .tmp/published-release-verification/${{ runner.os }}-node-${{ matrix.node }}.json

      - name: Retain the consumer-side verification record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: published-package-${{ runner.os }}-node-${{ matrix.node }}
          path: .tmp/published-release-verification/${{ runner.os }}-node-${{ matrix.node }}.json
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14

  published-action:
    name: Published GitHub Action / synthetic pull request
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out only the verification harness
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up the Action's pinned Node.js and npm environment
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 22.13.1
          package-manager-cache: false

      - name: Prepare isolated synthetic baseline and candidate repositories
        id: targets
        run: node scripts/prepare-published-action-targets.mjs

      - name: Execute the immutable published Action
        id: api-intel
        uses: fakrulauzaie/api-intel@641d830176f9ba36875392edd5c419da9d5e01b1
        with:
          baseline-directory: ${{ steps.targets.outputs.baseline-directory }}
          baseline-revision: ${{ steps.targets.outputs.baseline-revision }}
          baseline-package-manager: npm
          baseline-package-manager-version: 10.9.2
          baseline-lockfile: package-lock.json
          candidate-directory: ${{ steps.targets.outputs.candidate-directory }}
          candidate-revision: ${{ steps.targets.outputs.candidate-revision }}
          candidate-package-manager: npm
          candidate-package-manager-version: 10.9.2
          candidate-lockfile: package-lock.json
          configuration: ${{ steps.targets.outputs.baseline-directory }}/api-intel.config.json
          output-directory: .api-intel-published-action-results
          artifact-name: published-action-${{ github.event.pull_request.number }}-${{ github.run_attempt }}
          retention-days: 14

      - name: Verify hosted Action outputs and canonical artifact bytes
        env:
          API_INTEL_ACTION_ARTIFACT_PATH: ${{ steps.api-intel.outputs.artifact-path }}
        run: node scripts/verify-published-action-result.mjs
